<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
</head>

<nav class="site-nav">
  <div class="nav-left">
    <a href="index.html" class="brand"><svg class="brand-icon" width="30" height="22" viewBox="0 0 64 48" aria-hidden="true">
      <path d="M10 30 Q17 12 24 30 T38 30 Q45 12 52 30" fill="none" stroke="#49D6C4" stroke-width="7" stroke-linecap="round" opacity="0.18"></path>
      <path d="M10 30 Q17 12 24 30 T38 30 Q45 12 52 30" fill="none" stroke="#49D6C4" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="6 5"></path>
      <circle cx="10" cy="30" r="3" fill="#FF7A9C"></circle>
      <circle cx="52" cy="30" r="3" fill="#FF7A9C"></circle>
    </svg> Wavelength</a>
    <button class="back-btn" onclick="history.length > 1 ? history.back() : window.location.assign('index.html')">← Back</button>
  </div>
  <div class="links">
    <a href="guidelines.html">Guidelines</a>
    <a href="privacy.html">Privacy</a>
    <a href="friends.html">Friends</a>
    <a href="#" id="nav-logout">Log out</a>
    <a href="chat.html" class="cta">Start chatting</a>
  </div>
</nav>

<div class="app-wrap">
  <div class="app">
    <div class="card">
      <div class="avatar-edit-wrap">
        <div class="avatar" id="avatar-preview">?</div>
        <label for="avatar-input" class="avatar-edit-btn" title="Change photo">✎</label>
        <input type="file" id="avatar-input" accept="image/*" style="display:none;" />
      </div>

      <h1 id="profile-display-name" style="text-align:center; margin-bottom:4px;">Profile</h1>
      <p class="sub" style="text-align:center; margin-bottom:20px;">Registered Member</p>

      <div class="profile-stats">
        <div class="profile-stat">
          <span class="profile-stat-num" id="stat-friends">0</span>
          <span class="profile-stat-label">Friends</span>
        </div>
      </div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="prof-username" class="text-input" placeholder="Username" />
      </div>

      <div class="field">
        <label>Age <span style="font-weight:400;text-transform:none;">(18-99, optional)</span></label>
        <input type="number" id="prof-age" min="18" max="99" class="text-input" placeholder="Age" />
      </div>

      <div class="field">
        <label>Bio <span style="font-weight:400;text-transform:none;">(Max 160 characters)</span></label>
        <textarea id="prof-bio" class="text-input" maxlength="160" placeholder="A little about yourself..."></textarea>
      </div>

      <p class="form-error" id="form-error"></p>
      <p class="form-success" id="form-success"></p>

      <button class="btn" id="save-btn">Save Changes</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = '';
  function getAuth(){
    const token = localStorage.getItem('wl_auth_token');
    const username = localStorage.getItem('wl_username');
    return token && username ? { token, username } : null;
  }
  const auth = getAuth();
  if(!auth) window.location.href = 'login.html';

  document.getElementById('nav-logout').addEventListener('click', (e)=>{
    e.preventDefault();
    localStorage.removeItem('wl_auth_token');
    localStorage.removeItem('wl_username');
    window.location.href = 'index.html';
  });

  const usernameInput = document.getElementById('prof-username');
  const ageInput = document.getElementById('prof-age');
  const bioInput = document.getElementById('prof-bio');
  const avatarPreview = document.getElementById('avatar-preview');
  const avatarFileInput = document.getElementById('avatar-input');
  const errorEl = document.getElementById('form-error');
  const successEl = document.getElementById('form-success');
  const saveBtn = document.getElementById('save-btn');
  let base64Avatar = '';

  async function loadProfile(){
    try {
      const res = await fetch(`${API_BASE}/api/auth/me`, {
        headers: { Authorization: `Bearer ${auth.token}` }
      });
      const data = await res.json();
      if(!data.loggedIn){
        localStorage.removeItem('wl_auth_token');
        localStorage.removeItem('wl_username');
        window.location.href = 'login.html';
        return;
      }
      usernameInput.value = data.username || '';
      document.getElementById('profile-display-name').textContent = data.username || 'Profile';
      if(data.age) ageInput.value = data.age;
      if(data.bio) bioInput.value = data.bio;
      document.getElementById('stat-friends').textContent = data.friendCount || 0;

      if(data.avatarData){
        base64Avatar = data.avatarData;
        avatarPreview.innerHTML = `<img src="${data.avatarData}" alt="Avatar">`;
      } else {
        avatarPreview.textContent = (data.username || '?')[0].toUpperCase();
      }
    } catch {
      errorEl.textContent = 'Could not load profile details.';
    }
  }
  loadProfile();

  avatarFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 120;
        let w = img.width, h = img.height;
        if(w > h){ h = (h / w) * maxDim; w = maxDim; }
        else { w = (w / h) * maxDim; h = maxDim; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        base64Avatar = canvas.toDataURL('image/jpeg', 0.8);
        avatarPreview.innerHTML = `<img src="${base64Avatar}" alt="Avatar">`;
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  saveBtn.addEventListener('click', async ()=>{
    errorEl.textContent = '';
    successEl.textContent = '';
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    const payload = {
      username: usernameInput.value.trim(),
      bio: bioInput.value.trim(),
      age: ageInput.value ? parseInt(ageInput.value, 10) : null,
      avatarData: base64Avatar
    };

    try {
      const res = await fetch(`${API_BASE}/api/profile`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${auth.token}`
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(!res.ok){
        errorEl.textContent = data.error || 'Failed to update profile.';
      } else {
        successEl.textContent = 'Profile updated successfully!';
        if(data.token){
          localStorage.setItem('wl_auth_token', data.token);
          localStorage.setItem('wl_username', data.username);
        }
        document.getElementById('profile-display-name').textContent = data.username;
      }
    } catch {
      errorEl.textContent = 'Server error updating profile.';
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  });
</script>
</body>
</html>
