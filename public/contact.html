<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacts — Wavelength</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="dot"></span> WAVELENGTH</a>
  <div class="links">
    <a href="guidelines.html">Guidelines</a>
    <a href="privacy.html">Privacy</a>
    <a href="#" id="nav-logout">Log out</a>
    <a href="chat.html" class="cta">Start chatting</a>
  </div>
</nav>

<div class="doc" id="signed-out-notice" style="display:none;">
  <h1>Sign in to see your contacts</h1>
  <p>Contacts and saved chat history are only available for registered accounts. <a href="login.html" style="color:var(--signal);">Sign in</a> or <a href="register.html" style="color:var(--signal);">create an account</a> — both are free.</p>
</div>

<div class="doc" id="contacts-view">
  <h1>Your contacts</h1>
  <p class="updated" id="loading-note">Loading...</p>

  <div id="contacts-list"></div>

  <h2 style="margin-top:44px;">Past conversations</h2>
  <div id="history-list"></div>
</div>

<script>
  const API_BASE = ""; // Set to your live Render URL once deployed.

  function getAuth(){
    const token = localStorage.getItem('wl_auth_token');
    const username = localStorage.getItem('wl_username');
    return token && username ? { token, username } : null;
  }

  const auth = getAuth();
  document.getElementById('nav-logout').addEventListener('click', (e)=>{
    e.preventDefault();
    localStorage.removeItem('wl_auth_token');
    localStorage.removeItem('wl_username');
    window.location.href = 'index.html';
  });

  if(!auth){
    document.getElementById('signed-out-notice').style.display = 'block';
    document.getElementById('contacts-view').style.display = 'none';
  } else {
    loadContacts();
    loadHistory();
  }

  async function authedFetch(path){
    const res = await fetch(`${API_BASE}${path}`, {
      headers: { Authorization: `Bearer ${auth.token}` },
    });
    if(res.status === 401){
      localStorage.removeItem('wl_auth_token');
      localStorage.removeItem('wl_username');
      window.location.href = 'login.html';
      return null;
    }
    return res.json();
  }

  async function loadContacts(){
    const data = await authedFetch('/api/contacts');
    if(!data) return;
    const list = document.getElementById('contacts-list');
    document.getElementById('loading-note').style.display = 'none';
    if(!data.contacts || !data.contacts.length){
      list.innerHTML = '<p style="color:var(--muted);">No contacts yet — add someone while chatting with them.</p>';
      return;
    }
    list.innerHTML = '';
    data.contacts.forEach(c=>{
      const row = document.createElement('a');
      row.className = 'contact-row';
      row.href = `chat.html?with=${encodeURIComponent(c.username)}`;
      row.innerHTML = `
        <span class="contact-dot ${c.online ? 'online' : ''}"></span>
        <span class="contact-name">${escapeHtml(c.username)}</span>
        <span class="contact-status">${c.online ? 'Online — chat now' : 'Offline'}</span>
      `;
      list.appendChild(row);
    });
  }

  async function loadHistory(){
    const data = await authedFetch('/api/history');
    if(!data) return;
    const list = document.getElementById('history-list');
    if(!data.conversations || !data.conversations.length){
      list.innerHTML = '<p style="color:var(--muted);">No past conversations yet.</p>';
      return;
    }
    list.innerHTML = '';
    data.conversations.forEach(c=>{
      const row = document.createElement('a');
      row.className = 'contact-row';
      row.href = `chat.html?with=${encodeURIComponent(c.otherUsername)}`;
      const preview = c.lastMessageWasMine ? `You: ${c.lastMessagePreview}` : c.lastMessagePreview;
      row.innerHTML = `
        <span class="contact-name">${escapeHtml(c.otherUsername)}</span>
        <span class="contact-status">${escapeHtml(preview || '')}</span>
      `;
      list.appendChild(row);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
