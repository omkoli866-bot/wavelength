  </a>
  <a href="chat.html?open=recent" class="side-rail-link" title="Recent Chats">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
  </a>
  <a href="friends.html" class="side-rail-link" title="Friends">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><circle cx="18" cy="9" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2 4.5 4.3"/></svg>
  </a>
</nav>

<nav class="site-nav">
  <div class="nav-left">
    <a href="index.html" class="brand"><svg class="brand-icon" width="30" height="22" viewBox="0 0 64 48" aria-hidden="true">
      <path d="M10 30 Q17 12 24 30 T38 30 Q45 12 52 30" fill="none" stroke="#49D6C4" stroke-width="7" stroke-linecap="round" opacity="0.18"></path>
      <path d="M10 30 Q17 12 24 30 T38 30 Q45 12 52 30" fill="none" stroke="#49D6C4" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="6 5"></path>
      <circle cx="10" cy="30" r="3" fill="#FF7A9C"></circle>
      <circle cx="52" cy="30" r="3" fill="#FF7A9C"></circle>
    </svg> Wavelength</a>
    <button class="back-btn" onclick="history.length > 1 ? history.back() : window.location.assign('index.html')">← Back</button>
  </div>
  <div class="links">
    <a href="guidelines.html">Guidelines</a>
    <a href="privacy.html">Privacy</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="nav-logout">Log out</a>
    <a href="chat.html" class="cta">Start chatting</a>
  </div>
</nav>

<div class="app-wrap" style="align-items:flex-start; padding-top:20px;">
  <div class="doc" id="contacts-view" style="width:100%;">
    <h1>Your Friends</h1>
    <p class="sub" id="loading-note">Loading your contacts list...</p>
    <div id="contacts-list"></div>

    <h2 style="margin-top:40px;">Recent Conversations</h2>
    <div id="history-list"></div>
  </div>
</div>

<script>
  const API_BASE = '';
  function getAuth(){
    const token = localStorage.getItem('wl_auth_token');
    const username = localStorage.getItem('wl_username');
    return token && username ? { token, username } : null;
  }
  const auth = getAuth();
  if(!auth) window.location.href = 'login.html';

  document.getElementById('nav-logout').addEventListener('click', (e)=>{
    e.preventDefault();
    localStorage.removeItem('wl_auth_token');
    localStorage.removeItem('wl_username');
    window.location.href = 'index.html';
  });

  async function loadFriends(){
    const res = await fetch(`${API_BASE}/api/contacts`, {
      headers: { Authorization: `Bearer ${auth.token}` }
    });
    const data = await res.json();
    const list = document.getElementById('contacts-list');
    document.getElementById('loading-note').style.display = 'none';

    if(!data.contacts || !data.contacts.length){
      list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px 0;">No friends added yet. Match in chat to add someone!</p>';
      return;
    }
    list.innerHTML = '';
    data.contacts.forEach(c=>{
      const row = document.createElement('a');
      row.className = 'contact-row';
      row.href = `chat.html?with=${encodeURIComponent(c.username)}`;
      row.innerHTML = `
        <span class="contact-dot ${c.online ? 'online' : ''}"></span>
        <span class="contact-name">${c.username}</span>
        <span class="contact-status">${c.online ? 'Online — Click to chat' : 'Offline'}</span>
      `;
      list.appendChild(row);
    });
  }
  loadFriends();
</script>
</body>
</html>
