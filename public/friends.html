<div class="doc" id="signed-out-notice" style="display:none;">
  <h1>Sign in to see your contacts</h1>
  <p>Friends and saved chat history are available on registered accounts. <a href="login.html" style="color:var(--signal);">Sign in</a> or <a href="register.html" style="color:var(--signal);">create an account</a>.</p>
</div>

<div class="doc" id="contacts-view">
  <h1>Your friends</h1>
  <p class="updated" id="loading-note">Loading contacts...</p>
  <div id="contacts-list"></div>

  <h2 style="margin-top:44px;">Recent Conversations</h2>
  <div id="history-list"></div>
</div>

<script>
  const API_BASE = "";

  function getAuth(){
    const token = localStorage.getItem('wl_auth_token');
    const username = localStorage.getItem('wl_username');
    return token && username ? { token, username } : null;
  }

  const auth = getAuth();
  document.getElementById('nav-logout').addEventListener('click', (e)=>{
    e.preventDefault();
    localStorage.removeItem('wl_auth_token');
    localStorage.removeItem('wl_username');
    window.location.href = 'index.html';
  });

  if(!auth){
    document.getElementById('signed-out-notice').style.display = 'block';
    document.getElementById('contacts-view').style.display = 'none';
  } else {
    loadFriends();
    loadHistory();
  }

  async function authedFetch(path){
    const res = await fetch(`${API_BASE}${path}`, {
      headers: { Authorization: `Bearer ${auth.token}` },
    });
    if(res.status === 401){
      localStorage.removeItem('wl_auth_token');
      localStorage.removeItem('wl_username');
      window.location.href = 'login.html';
      return null;
    }
    return res.json();
  }

  async function loadFriends(){
    const data = await authedFetch('/api/contacts');
    if(!data) return;
    const list = document.getElementById('contacts-list');
    document.getElementById('loading-note').style.display = 'none';
    if(!data.contacts || !data.contacts.length){
      list.innerHTML = '<p style="color:var(--muted);">No friends added yet. Connect with someone in chat to add them.</p>';
      return;
    }
    list.innerHTML = '';
    data.contacts.forEach(c=>{
      const row = document.createElement('a');
      row.className = 'contact-row';
      row.href = `chat.html?with=${encodeURIComponent(c.username)}`;
      const avatarHTML = c.avatarData
        ? `<img src="${c.avatarData}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">`
        : `<div class="avatar" style="width:34px;height:34px;">${c.username[0].toUpperCase()}</div>`;

      row.innerHTML = `
        <span class="contact-dot ${c.online ? 'online' : ''}"></span>
        ${avatarHTML}
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span class="contact-name">${escapeHtml(c.username)}</span>
          ${c.bio ? `<span style="font-size:11px;color:var(--muted);">${escapeHtml(c.bio)}</span>` : ''}
        </div>
        <span class="contact-status">${c.online ? 'Online — Click to Chat' : 'Offline'}</span>
      `;
      list.appendChild(row);
    });
  }

  async function loadHistory(){
    const data = await authedFetch('/api/history');
    if(!data) return;
    const list = document.getElementById('history-list');
    if(!data.conversations || !data.conversations.length){
      list.innerHTML = '<p style="color:var(--muted);">No past conversations saved.</p>';
      return;
    }
    list.innerHTML = '';
    data.conversations.forEach(c=>{
      const row = document.createElement('a');
      row.className = 'contact-row';
      row.href = `chat.html?with=${encodeURIComponent(c.otherUsername)}`;
      const preview = c.lastMessageWasMine ? `You: ${c.lastMessagePreview}` : c.lastMessagePreview;
      row.innerHTML = `
        <span class="contact-name">${escapeHtml(c.otherUsername)}</span>
        <span class="contact-status">${escapeHtml(preview || '')}</span>
      `;
      list.appendChild(row);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
